<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CookAI - เข้าสู่ระบบ</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  body { font-family: 'Prompt', sans-serif; }
  .screen { display: none; }
  .screen.active { display: block; }
  .spin { animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body class="bg-slate-50 min-h-screen flex justify-center items-center">

<!-- Mobile Container Emulator (เหมือน CookAI_Frontend.html) -->
<div class="w-full max-w-md bg-white min-h-screen shadow-2xl relative flex flex-col overflow-x-hidden">

  <!-- แถบตั้งค่า API URL -->
  <div class="px-6 pt-4 flex items-center gap-2">
    <i class="fa-solid fa-server text-gray-300 text-xs"></i>
    <input id="api-base" value="http://127.0.0.1:8000"
      class="flex-1 text-[11px] text-gray-400 bg-gray-50 border border-gray-100 rounded-lg px-2 py-1 focus:outline-none focus:border-orange-300">
  </div>

  <!-- ================= SCREEN LOGIN ================= -->
  <div id="screen-login" class="screen active p-6 flex-1 flex flex-col justify-center">
    <div class="text-center mb-8">
      <div class="w-16 h-16 bg-gradient-to-br from-orange-500 to-amber-500 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-orange-500/30">
        <i class="fa-solid fa-utensils text-white text-2xl"></i>
      </div>
      <h1 class="text-2xl font-bold text-gray-800">CookAI</h1>
      <p class="text-gray-400 text-sm mt-1">เข้าสู่ระบบเพื่อเริ่มคิดเมนู</p>
    </div>

    <div class="space-y-3 mb-4">
      <input id="login-username" type="text" placeholder="Username"
        class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-orange-500">
      <input id="login-password" type="password" placeholder="Password"
        class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-orange-500">
    </div>

    <p id="login-error" class="text-red-500 text-xs mb-3 hidden"></p>

    <button onclick="handleLogin()" id="login-btn"
      class="w-full py-3.5 bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-600 hover:to-amber-600 text-white font-bold rounded-xl shadow-lg shadow-orange-500/30 transition-all flex items-center justify-center gap-2">
      <i class="fa-solid fa-right-to-bracket"></i> เข้าสู่ระบบ
    </button>

    <p class="text-center text-sm text-gray-400 mt-5">
      ยังไม่มีบัญชี?
      <button onclick="goTo('register')" class="text-orange-600 font-semibold">สมัครสมาชิก</button>
    </p>
  </div>

  <!-- ================= SCREEN REGISTER ================= -->
  <div id="screen-register" class="screen p-6 flex-1 flex flex-col justify-center">
    <div class="text-center mb-8">
      <h1 class="text-2xl font-bold text-gray-800">สมัครสมาชิก</h1>
      <p class="text-gray-400 text-sm mt-1">สร้างบัญชีใหม่เพื่อใช้งาน CookAI</p>
    </div>

    <div class="space-y-3 mb-4">
      <input id="reg-username" type="text" placeholder="Username (อย่างน้อย 3 ตัวอักษร)"
        class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-orange-500">
      <input id="reg-email" type="email" placeholder="Email (ไม่บังคับ)"
        class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-orange-500">
      <input id="reg-password" type="password" placeholder="Password (อย่างน้อย 6 ตัวอักษร)"
        class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl text-sm focus:outline-none focus:border-orange-500">
    </div>

    <p id="register-error" class="text-red-500 text-xs mb-3 hidden"></p>
    <p id="register-success" class="text-green-600 text-xs mb-3 hidden"></p>

    <button onclick="handleRegister()" id="register-btn"
      class="w-full py-3.5 bg-gray-800 hover:bg-gray-700 text-white font-bold rounded-xl shadow-lg transition-all flex items-center justify-center gap-2">
      <i class="fa-solid fa-user-plus"></i> สมัครสมาชิก
    </button>

    <p class="text-center text-sm text-gray-400 mt-5">
      มีบัญชีอยู่แล้ว?
      <button onclick="goTo('login')" class="text-orange-600 font-semibold">เข้าสู่ระบบ</button>
    </p>
  </div>

  <!-- ================= SCREEN PRESENT (หลังล็อกอินสำเร็จ) ================= -->
  <div id="screen-present" class="screen p-6 flex-1 flex flex-col">
    <div class="flex justify-between items-center mb-8">
      <div>
        <p class="text-gray-400 text-sm">เข้าสู่ระบบสำเร็จ 🎉</p>
        <h1 class="text-2xl font-bold text-gray-800">ยินดีต้อนรับ</h1>
      </div>
      <div id="avatar" class="w-12 h-12 bg-amber-500 text-white rounded-full flex items-center justify-center font-bold shadow-md text-lg"></div>
    </div>

    <div class="bg-gradient-to-br from-orange-500 to-red-600 rounded-2xl p-5 text-white mb-6 shadow-lg shadow-orange-500/20">
      <span class="bg-white/20 text-[10px] uppercase font-bold px-2 py-0.5 rounded-md">Logged in as</span>
      <p id="present-username" class="text-2xl font-bold mt-2">-</p>
      <p id="present-email" class="text-xs opacity-80 mt-1">-</p>
    </div>

    <div class="bg-gray-50 border border-gray-100 rounded-xl p-4 mb-6 text-sm space-y-2">
      <div class="flex justify-between"><span class="text-gray-400">User ID</span><span id="present-id" class="font-semibold text-gray-700">-</span></div>
      <div class="flex justify-between"><span class="text-gray-400">สถานะ</span><span id="present-active" class="font-semibold text-gray-700">-</span></div>
      <div class="flex justify-between"><span class="text-gray-400">สมัครเมื่อ</span><span id="present-created" class="font-semibold text-gray-700">-</span></div>
    </div>

    <div class="bg-white border border-gray-100 rounded-xl p-4 mb-6">
      <p class="text-xs font-semibold text-gray-500 mb-2">Access Token (JWT)</p>
      <p id="present-token" class="text-[10px] text-gray-400 break-all leading-relaxed">-</p>
    </div>

    <div class="mt-auto">
      <button onclick="handleLogout()"
        class="w-full py-3.5 border border-red-200 text-red-500 hover:bg-red-50 font-bold rounded-xl transition-all flex items-center justify-center gap-2">
        <i class="fa-solid fa-right-from-bracket"></i> ออกจากระบบ
      </button>
    </div>
  </div>

</div>

<script>
let currentToken = null; // เก็บ token ไว้ใน memory เท่านั้น (รีเฟรชหน้าแล้วจะหลุด ต้อง login ใหม่)

function apiBase() {
  return document.getElementById('api-base').value.replace(/\/$/, '');
}

function goTo(screen) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + screen).classList.add('active');
}

function showError(elId, msg) {
  const el = document.getElementById(elId);
  el.textContent = msg;
  el.classList.remove('hidden');
}
function hideError(elId) {
  document.getElementById(elId).classList.add('hidden');
}

async function handleRegister() {
  hideError('register-error');
  document.getElementById('register-success').classList.add('hidden');

  const username = document.getElementById('reg-username').value.trim();
  const email = document.getElementById('reg-email').value.trim();
  const password = document.getElementById('reg-password').value;

  if (username.length < 3 || password.length < 6) {
    showError('register-error', 'username ต้อง >= 3 ตัวอักษร และ password ต้อง >= 6 ตัวอักษร');
    return;
  }

  const btn = document.getElementById('register-btn');
  btn.disabled = true;
  btn.innerHTML = '<i class="fa-solid fa-spinner spin"></i> กำลังสมัคร...';

  try {
    const res = await fetch(apiBase() + '/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password, email: email || null })
    });
    const data = await res.json();
    if (!res.ok) {
      showError('register-error', data.detail || 'สมัครไม่สำเร็จ');
    } else {
      document.getElementById('register-success').textContent = 'สมัครสำเร็จ! กำลังพาไปหน้าเข้าสู่ระบบ...';
      document.getElementById('register-success').classList.remove('hidden');
      document.getElementById('login-username').value = username;
      setTimeout(() => goTo('login'), 900);
    }
  } catch (e) {
    showError('register-error', 'เชื่อมต่อ API ไม่ได้ — เช็คว่ารัน uvicorn อยู่ และ URL ด้านบนถูกต้องไหม');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="fa-solid fa-user-plus"></i> สมัครสมาชิก';
  }
}

async function handleLogin() {
  hideError('login-error');
  const username = document.getElementById('login-username').value.trim();
  const password = document.getElementById('login-password').value;

  if (!username || !password) {
    showError('login-error', 'กรอก username และ password ให้ครบ');
    return;
  }

  const btn = document.getElementById('login-btn');
  btn.disabled = true;
  btn.innerHTML = '<i class="fa-solid fa-spinner spin"></i> กำลังเข้าสู่ระบบ...';

  try {
    const res = await fetch(apiBase() + '/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();
    if (!res.ok) {
      showError('login-error', data.detail || 'เข้าสู่ระบบไม่สำเร็จ');
      return;
    }
    currentToken = data.access_token;
    await loadProfileAndPresent();
  } catch (e) {
    showError('login-error', 'เชื่อมต่อ API ไม่ได้ — เช็คว่ารัน uvicorn อยู่ และ URL ด้านบนถูกต้องไหม');
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> เข้าสู่ระบบ';
  }
}

async function loadProfileAndPresent() {
  const res = await fetch(apiBase() + '/me', {
    headers: { 'Authorization': 'Bearer ' + currentToken }
  });
  const user = await res.json();
  if (!res.ok) {
    showError('login-error', 'โหลดข้อมูลผู้ใช้ไม่สำเร็จ');
    return;
  }

  document.getElementById('avatar').textContent = user.username.charAt(0).toUpperCase();
  document.getElementById('present-username').textContent = user.username;
  document.getElementById('present-email').textContent = user.email || 'ไม่ได้ระบุอีเมล';
  document.getElementById('present-id').textContent = user.id;
  document.getElementById('present-active').textContent = user.is_active ? 'ใช้งานได้' : 'ถูกระงับ';
  document.getElementById('present-created').textContent = new Date(user.created_at).toLocaleString('th-TH');
  document.getElementById('present-token').textContent = currentToken;

  goTo('present');
}

async function handleLogout() {
  try {
    await fetch(apiBase() + '/logout', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + currentToken }
    });
  } catch (e) {
    // ไม่ต้องทำอะไร แม้ logout ที่ server ไม่สำเร็จ ก็เคลียร์ token ฝั่ง client อยู่ดี
  }
  currentToken = null;
  document.getElementById('login-password').value = '';
  goTo('login');
}
</script>
</body>
</html>
